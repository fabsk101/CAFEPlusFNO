[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cafe-plus-fno"
version = "0.1.0"
description = "CAFE+FNO paper experiment code"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = [
    "h5py==3.15.1",
    "numpy==2.4.6",
    "torch==2.8.0",
    "tensorly==0.9.0",
    "tensorly-torch==0.5.0",
    "opt_einsum==3.4.0",
    "requests==2.32.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["models*", "experiments*"]
